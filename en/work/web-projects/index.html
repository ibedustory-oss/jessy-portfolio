\",\"items\":[{\"title\":\"Speaks implementation\",\"body\":\"Eight years writing code before I ever wrote a spec. When I cut scope I can tell what is expensive and what is cheap, and I can say it in the same language the engineers use.\",\"proof\":\"Eight years as a project engineer, leading new service development in Japan and Indonesia.\"},{\"title\":\"Owns the numbers\",\"body\":\"I am a U.S. CPA. I work backwards from unit economics and pricing to check whether something holds up as a business first. I have owned a new-business P\u0026L.\",\"proof\":\"Led new-business P\u0026L, then GTM and feature planning for a recruiting SaaS used by 2,500+ companies.\"},{\"title\":\"Builds AI operations\",\"body\":\"Planning, quality checks and distribution are wired together as an agent system. Work that would take an editorial team now runs on it every week.\",\"proof\":\"Atelier Why: curation → AI quality gates → production → email/LINE delivery, automated and running as a subscription.\"}],\"numbers\":[{\"v\":\"8 yrs\",\"l\":\"as a software engineer\"},{\"v\":\"2,500+\",\"l\":\"companies on the SaaS I ran GTM for\"},{\"v\":\"Weekly\",\"l\":\"AI-powered editorial operation\"},{\"v\":\"3\",\"l\":\"working languages — JA · EN · KO\"}]},\"workSection\":{\"heading\":\"Selected Work\",\"sub\":\"Projects I founded and built from zero.\",\"view\":\"View case study\"},\"projects\":[{\"slug\":\"atelier-why\",\"category\":\"MEDIA / EDUCATION / 0→1\",\"year\":\"2025 —\",\"title\":\"Atelier Why\",\"tagline\":\"A media brand for parents raising children in the age of AI.\",\"overview\":\"A media brand exploring parenting, English, education and thinking skills in the age of AI. Founded and operated end to end — from concept and brand to content, web and social.\",\"roles\":[\"Founder\",\"Concept\",\"Branding\",\"Content\",\"Web\",\"SNS\",\"Media Development\"],\"hasDetail\":true,\"detail\":{\"about\":\"A media brand on parenting, English, education and thinking skills in the age of AI. Weekly theme design, video curation, thinking-skills worksheets, articles, social and email — the whole editorial operation, built from zero.\",\"challenge\":\"There is an infinite supply of educational content for children, yet nothing that answers the question parents actually have: what should we watch this week, and how? In an age of too much information, choosing is the hardest part. The service had to be designed from the concept up to take that burden off parents.\",\"concept\":\"Learning that starts with \\\"why?\\\", delivered every week. Combining AI-powered curation with an editorial point of view, videos, worksheets and articles are edited into age-based weekly programs. Designed not as English-teaching material, but as a media brand that grows thinking skills.\",\"process\":[\"Concept\",\"Brand\",\"Web\",\"Product\",\"Content\",\"Launch\",\"Operation\"],\"result\":[\"Launched as a subscription service\",\"Ongoing weekly programs by age group\",\"A brand spanning web, social, email and LINE\",\"An AI-powered editorial operation, built from scratch\"],\"link\":{\"label\":\"atelier-why.com\",\"href\":\"https://atelier-why.com\"}}},{\"slug\":\"food-school\",\"category\":\"FOOD / LOCAL / BUSINESS DEVELOPMENT\",\"year\":\"2026 —\",\"title\":\"Food School\",\"tagline\":\"Building the future of a region, starting from food.\",\"overview\":\"A project that turns a region’s food culture, craft and people into new forms of learning, experience and business. Responsible across business concept, brand, recruiting, social and experience design.\",\"roles\":[\"Project Development\",\"Concept\",\"Branding\",\"Experience Design\",\"Recruiting\",\"SNS\",\"Communication\",\"Business Development\"],\"hasDetail\":true,\"detail\":{\"about\":\"Set in Yahiko and the Tsubame-Sanjo area of Niigata, Japan — a project that builds new learning and business from the region’s food culture, craft and people. Responsible across business concept, recruiting communication, social and experience programs.\",\"challenge\":\"The region has real culinary craft and culture — but not enough people to carry it forward as a livelihood. Not a job posting, not a cooking class: it needed a framework for learning how to build a way of working, and a business, starting from local food.\",\"concept\":\"Live the first cycle of starting a business — before betting your capital on it. Designed not as classroom study but as learning through a full business cycle in the field. Concept, recruiting communication, social and experience programs were built as one coherent brand.\",\"process\":[\"Research\",\"Concept\",\"Brand\",\"Recruiting\",\"Content\",\"Experience\"],\"result\":[\"Project launch and first-cohort recruiting\",\"Recruiting communication and landing page\",\"Social and short-form video operation\",\"Partnerships with local producers and businesses\"]}},{\"slug\":\"social-brand\",\"category\":\"SOCIAL / CONTENT / BRAND\",\"year\":\"Ongoing\",\"title\":\"Social / Brand Communication\",\"tagline\":\"Not follower counts — a brand voice.\",\"overview\":\"Social designed not for numbers, but as the place where a brand’s character comes through. From brand voice and content strategy to feed, reels, stories, campaigns and how it all connects back to the web.\",\"roles\":[\"Brand Voice\",\"Content Strategy\",\"Feed / Reel / Story\",\"Campaign\",\"Editorial Concept\"],\"hasDetail\":false}],\"offer\":{\"label\":\"Strategy \u0026 Web\",\"heading\":\"First the why. Then the website.\",\"body\":\"We articulate your why, decide targeting and positioning, map the 4Ps — then ship it all as a site.\",\"points\":[\"A one-page strategy sheet\",\"No copy needed from you\",\"Strategy through launch, one thread\"],\"cta\":\"See pricing and process\",\"note\":\"Currently taking new projects.\"},\"how\":{\"heading\":\"From zero to one.\",\"sub\":\"Four steps from something that doesn’t exist yet to a working business.\",\"steps\":[{\"num\":\"01\",\"name\":\"FIND\",\"desc\":\"Find the value that hasn’t been put into words yet.\",\"items\":[\"Research\",\"Customer\",\"Market\",\"Insight\"]},{\"num\":\"02\",\"name\":\"DEFINE\",\"desc\":\"Put what to build into words.\",\"items\":[\"Concept\",\"Positioning\",\"Brand\",\"Story\",\"Customer\"]},{\"num\":\"03\",\"name\":\"BUILD\",\"desc\":\"Make it real.\",\"items\":[\"Business\",\"Service\",\"Brand\",\"Website\",\"Content\"]},{\"num\":\"04\",\"name\":\"GROW\",\"desc\":\"Bring it to people.\",\"items\":[\"Social\",\"Content\",\"Community\",\"Campaign\",\"PR\"]}]},\"services\":{\"heading\":\"Services\",\"note\":\"Three ways of working — not a menu of deliverables.\",\"groups\":[{\"num\":\"01\",\"name\":\"Zero-to-One\",\"sub\":\"New business \u0026 project development\",\"items\":[\"Business Development\",\"Concept\",\"New Business\",\"Service Design\",\"Research\",\"Project Direction\"]},{\"num\":\"02\",\"name\":\"Brand \u0026 Web\",\"sub\":\"Brand and web as one experience\",\"items\":[\"Brand Concept\",\"Website\",\"Landing Page\",\"Information Architecture\",\"UX\",\"Copywriting\",\"Creative Direction\"]},{\"num\":\"03\",\"name\":\"Social \u0026 Content\",\"sub\":\"A brand voice, made into content\",\"items\":[\"SNS Strategy\",\"Instagram\",\"Content Planning\",\"Content Direction\",\"Creative Direction\",\"Media Operation\"]}]},\"about\":{\"heading\":\"About\",\"name\":\"Jessy (Giyoung) Jung\",\"credential\":\"U.S. CPA\",\"title\":\"0→1 Product Manager / Business Builder\",\"body\":[\"I work with businesses and ideas at the zero-to-one stage — shaping concepts, building brands, creating websites and designing how they communicate with the world.\",\"My path: eight years as an engineer → U.S. CPA → SaaS product manager → founder. Speaking all three languages — implementation, numbers and product — is what sets me apart as a PM.\",\"Today I wire all of it into AI agents so the full loop — think, build, operate — never breaks.\"]},\"career\":{\"heading\":\"Career\",\"sub\":\"Engineering, busin
