Key\":\"children\",\"segmentPath\":[\"children\",\"$8\",\"children\",\"work\",\"children\",\"web-projects\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L9\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L7\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"$8\",\"children\",\"work\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L9\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[[\"$\",\"$La\",null,{\"lang\":\"ja\"}],[\"$\",\"$Lb\",null,{\"lang\":\"ja\",\"dict\":{\"meta\":{\"title\":\"Jessy (Giyoung) Jung｜新規事業・ブランド・Web・SNS\",\"description\":\"新規事業やブランドの0→1から、Web制作・SNSまで支援するJessy (Giyoung) Jungのポートフォリオ。\"},\"nav\":{\"work\":\"Work\",\"services\":\"Services\",\"about\":\"About\",\"contact\":\"Contact\"},\"hero\":{\"title\":\"アイデアを、事業に。\",\"sub\":\"まだ形になっていないアイデアから、事業、ブランド、Web、SNSまで一緒につくります。\",\"name\":\"Jessy (Giyoung) Jung\",\"credential\":\"米国公認会計士（U.S. CPA）\",\"fields\":\"Strategy / Business / Brand / Web / Social\",\"cta\":\"Projectsを見る\"},\"intro\":{\"heading\":\"What I do\",\"body\":\"事業をつくるとき、ブランド、Web、SNSを別々には考えません。「誰に、何を、なぜ届けるのか」から考え、必要なものを一緒につくります。\",\"words\":[\"Business\",\"Brand\",\"Web\",\"Social\"]},\"edge\":{\"heading\":\"The Difference\",\"sub\":\"戦略と実装と数字を、同じ人が地続きで見ます。\",\"items\":[{\"title\":\"実装がわかる\",\"body\":\"エンジニアとして8年、実際にコードを書いてきました。だからスコープを切るとき、どこが重くてどこが軽いかが読めます。エンジニアと同じ言葉で話せます。\",\"proof\":\"プロジェクトエンジニアとして8年。日本・インドネシアで新規サービス開発をリード。\"},{\"title\":\"数字を持てる\",\"body\":\"米国公認会計士です。ユニットエコノミクスと価格から逆算して、事業として成立するかを先に確かめます。新規事業のP\u0026Lを持った経験があります。\",\"proof\":\"新規事業のP\u0026Lを主導。2,500社以上が使う採用SaaSのGTM・機能企画を担当。\"},{\"title\":\"AIで運用まで作る\",\"body\":\"企画から品質チェック、配信までをAIエージェントの仕組みとして組み立てました。編集部の規模でやる作業が、毎週それで動いています。\",\"proof\":\"Atelier Why:動画選定→AI品質ゲート→制作→メール/LINE配信まで自動化し、サブスクとして運営中。\"}],\"numbers\":[{\"v\":\"8年\",\"l\":\"エンジニアとしての開発経験\"},{\"v\":\"2,500社+\",\"l\":\"GTMを担当したSaaSの導入社数\"},{\"v\":\"毎週\",\"l\":\"AIで回す編集オペレーション\"},{\"v\":\"3言語\",\"l\":\"日本語・英語・韓国語で仕事\"}]},\"workSection\":{\"heading\":\"Selected Work\",\"sub\":\"自ら0から立ち上げたプロジェクトを中心に。\",\"view\":\"Case Studyを見る\"},\"projects\":[{\"slug\":\"atelier-why\",\"category\":\"MEDIA / EDUCATION / 0→1\",\"year\":\"2025 —\",\"title\":\"Atelier Why\",\"tagline\":\"AI時代を生きる親のためのメディア。\",\"overview\":\"AI時代の子育て・英語・教育・思考力をテーマにしたメディア。コンセプト設計からブランド、コンテンツ、Web、SNSまで一貫して立ち上げ・運営。\",\"roles\":[\"Founder\",\"Concept\",\"Branding\",\"Content\",\"Web\",\"SNS\",\"Media Development\"],\"hasDetail\":true,\"detail\":{\"about\":\"AI時代の子育て・英語・教育・思考力をテーマにしたメディア。週ごとのテーマ設計、動画キュレーション、思考力ワークシート、記事、SNS、メール配信まで、企画と運営のすべてをゼロから立ち上げた。\",\"challenge\":\"子ども向けの教育コンテンツは世の中に無限にあるのに、「今週、何をどう届ければいいか」に答えてくれるものがない。情報が多すぎる時代、いちばん難しいのは「選ぶこと」。その負担を親から引き受けるサービスを、コンセプトから設計する必要があった。\",\"concept\":\"「なぜ？」から始まる学びを、毎週届く形に。AIによるキュレーションと編集の視点を組み合わせ、動画・ワークシート・記事を年齢別の週次プログラムとして編集する。英語を教える教材ではなく、考える力を育てるメディアとして設計した。\",\"process\":[\"Concept\",\"Brand\",\"Web\",\"Product\",\"Content\",\"Launch\",\"Operation\"],\"result\":[\"サブスクリプションサービスとしてローンチ\",\"年齢別・週次プログラムの継続運営\",\"Web・SNS・メール・LINEを横断するブランド構築\",\"AIを組み込んだ編集オペレーションの構築\"],\"link\":{\"label\":\"atelier-why.com\",\"href\":\"https://atelier-why.com\"}}},{\"slug\":\"food-school\",\"category\":\"FOOD / LOCAL / BUSINESS DEVELOPMENT\",\"year\":\"2026 —\",\"title\":\"食の学校\",\"tagline\":\"食から、地域の未来をつくる。\",\"overview\":\"地域の食文化・技術・人を起点に、新しい学び・体験・事業をつくるプロジェクト。事業コンセプトからブランド、採用、SNS、体験設計まで横断して担当。\",\"roles\":[\"Project Development\",\"Concept\",\"Branding\",\"Experience Design\",\"Recruiting\",\"SNS\",\"Communication\",\"Business Development\"],\"hasDetail\":true,\"detail\":{\"about\":\"新潟・弥彦と燕三条エリアを舞台に、地域の食文化・技術・人を起点として、新しい学びと事業をつくるプロジェクト。事業コンセプトの設計から、募集コミュニケーション、SNS、体験プログラムまでを横断して担当。\",\"challenge\":\"地域には食の技術と文化が確かにあるのに、それを「仕事」として受け取る次の担い手が足りない。求人でも、料理教室でもない。地域の食を起点に、働き方と事業のつくり方そのものを学ぶ枠組みが必要だった。\",\"concept\":\"開業の一巡目を、資本を張る前に生きる。座学ではなく、地域の現場で事業の一巡を経験する学びとして設計。コンセプトから募集コミュニケーション、SNS、体験プログラムまでを一つのブランドとして構築した。\",\"process\":[\"Research\",\"Concept\",\"Brand\",\"Recruiting\",\"Content\",\"Experience\"],\"result\":[\"プロジェクトのローンチと0期生募集の開始\",\"採用コミュニケーション・LPの設計\",\"SNS・リール運用の立ち上げ\",\"地域の生産者・事業者との連携づくり\"]}},{\"slug\":\"social-brand\",\"category\":\"SOCIAL / CONTENT / BRAND\",\"year\":\"Ongoing\",\"title\":\"Social / Brand Communication\",\"tagline\":\"フォロワー数ではなく、ブランドの声をつくる。\",\"overview\":\"SNSを数字のためではなく、ブランドの人格を伝える場として設計する。Brand Voiceの定義から、コンテンツ戦略、フィード・リール・ストーリーの設計、Webとの連携、キャンペーンまで。\",\"roles\":[\"Brand Voice\",\"Content Strategy\",\"Feed / Reel / Story\",\"Campaign\",\"Editorial Concept\"],\"hasDetail\":false}],\"offer\":{\"label\":\"戦略とWeb\",\"heading\":\"「なぜ選ばれるのか」から、一緒につくります。\",\"body\":\"WHYの言語化、ターゲティング、ポジショニング、4P。戦略を決めてから、Webサイトという形にします。\",\"points\":[\"WHY・STP・4Pの戦略シート\",\"原稿の準備は不要\",\"戦略から公開まで一気通貫\"],\"cta\":\"料金と進め方を見る\",\"note\":\"いま相談を受け付けています。\"},\"how\":{\"heading\":\"From zero to one.\",\"sub\":\"まだ形になっていないものを、事業にするまでの4つのステップ。\",\"steps\":[{\"num\":\"01\",\"name\":\"FIND\",\"desc\":\"まだ言葉になっていない価値を見つける。\",\"items\":[\"Research\",\"Customer\",\"Market\",\"Insight\"]},{\"num\":\"02\",\"name\":\"DEFINE\",\"desc\":\"「何をつくるのか」を言葉にする。\",\"items\":[\"Concept\",\"Positioning\",\"Brand\",\"Story\",\"Customer\"]},{\"num\":\"03\",\"name\":\"BUILD\",\"desc\":\"実際に形にする。\",\"items\":[\"Business\",\"Service\",\"Brand\",\"Website\",\"Content\"]},{\"num\":\"04\",\"name\":\"GROW\",\"desc\":\"人に届ける。\",\"items\":[\"Social\",\"Content\",\"Community\",\"Campaign\",\"PR\"]}]},\"services\":{\"heading\":\"Services\",\"note\":\"できることを細かく並べるより、大きく三つ。\",\"groups\":[{\"num\":\"01\",\"name\":\"Zero-to-One\",\"sub\":\"新規事業・プロジェクト立ち上げ\",\"items\":[\"Business Development\",\"Concept\",\"New Business\",\"Service Design\",\"Research\",\"Project Direction\"]}
